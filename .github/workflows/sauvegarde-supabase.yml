# Sauvegarde quotidienne de la base Supabase, chiffrée, conservée 90 jours.
#
# Deux secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   SUPABASE_DB_URL          adresse de connexion « Session pooler » (Supabase > Connect),
#                            mot de passe de la base inclus
#   SAUVEGARDE_MOT_DE_PASSE  mot de passe de chiffrement des sauvegardes
#                            (à garder précieusement : sans lui, impossible de les relire)
#
# Restauration : voir SAUVEGARDES.md
name: Sauvegarde Supabase

on:
  schedule:
    - cron: "17 1 * * *"   # chaque nuit, 02 h 17 au Gabon
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MDP: ${{ secrets.SAUVEGARDE_MOT_DE_PASSE }}
    steps:
      - name: Vérifier les secrets
        run: |
          if [ -z "$DB_URL" ] || [ -z "$MDP" ]; then
            echo "::error::Secrets SUPABASE_DB_URL et/ou SAUVEGARDE_MOT_DE_PASSE manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Installer pg_dump 17 (même version que la base)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Exporter et chiffrer
        id: export
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/17/bin
          JOUR=$(TZ=Africa/Libreville date +%Y-%m-%d)
          mkdir -p sauvegarde
          # Tables, fonctions, règles d'accès et données de l'application
          $PG/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -f sauvegarde/application.sql
          # Comptes de connexion (gérante, laveurs, admin)
          $PG/pg_dump "$DB_URL" --data-only --table=auth.users --table=auth.identities \
            --no-owner --no-privileges -f sauvegarde/comptes.sql
          ls -la sauvegarde
          tar czf - sauvegarde | gpg --batch --yes --pinentry-mode loopback --symmetric \
            --cipher-algo AES256 --passphrase "$MDP" -o "mandji-$JOUR.tar.gz.gpg"
          rm -rf sauvegarde
          echo "jour=$JOUR" >> "$GITHUB_OUTPUT"

      - name: Conserver la sauvegarde (90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-mandji-${{ steps.export.outputs.jour }}-${{ github.run_id }}
          path: mandji-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
